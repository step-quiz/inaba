# Desempaqueta els zip que es pugen a _uploads/ i en desa el contingut, sense cap test.
#  · concurrency: si es pugen dos zip seguits, el segon espera que acabi el primer.
#  · També es pot llançar a mà: Actions → «Extract and commit zip uploads» → Run workflow.
name: Extract and commit zip uploads

on:
  push:
    paths:
      - '_uploads/**.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unzip-uploads
  cancel-in-progress: false

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bring the branch up to date
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - name: Unzip uploaded files
        run: |
          shopt -s nullglob
          for z in _uploads/*.zip; do
            echo "Processing $z"
            unzip -o "$z" -d . -x '.github/*'
            rm "$z"
          done

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-extract uploaded zip"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
